name = "cloudpulse"
main = "worker/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# 挂载前端打包静态资产 (Cloudflare Workers Static Assets)
assets = { directory = "./dist" }

# 1. 边缘 SQLite 数据库绑定 (D1)
[[d1_databases]]
binding = "DB"
database_name = "cloudpulse-d1"
database_id = "REPLACE_ME"

# 2. 边缘高速缓存绑定 (KV)
[[kv_namespaces]]
binding = "CACHE"
id = "REPLACE_ME"

# 3. 每 5 分钟定时巡检探活与告警 Cron Trigger
[triggers]
crons = ["*/5 * * * *"]

