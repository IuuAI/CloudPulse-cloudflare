name = "cloudpulse-cloudflare-api"
main = "worker/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# 挂载前端打包静态资产 (Cloudflare Workers Static Assets)
assets = { directory = "./dist" }

# 1. 边缘 SQLite 数据库绑定 (D1)
[[d1_databases]]
binding = "DB"
database_name = "cloudpulse-d1"
database_id = "0d30d27f-01db-4c20-b23f-d6940677675c"

# 2. 边缘高速缓存绑定 (KV)
[[kv_namespaces]]
binding = "CACHE"
id = "1343621be8b64badb66b8ad1f35dea7a"

# 3. 每 5 分钟定时巡检探活与告警 Cron Trigger
[triggers]
crons = ["*/20 * * * *"]

# 4. 环境变量与安全密钥声明 (Cloudflare Workers Secrets)
# 注意：ADMIN_PASSWORD 与 JWT_SECRET 属于机密信息，请勿在配置文件中明文填写！
# 生产环境请在 Cloudflare 控制台 (Workers -> Settings -> Variables and Secrets)
# 或在本地通过 CLI 注入：
#   npx wrangler secret put ADMIN_PASSWORD
#   npx wrangler secret put JWT_SECRET
# 本地开发测试请复制 .dev.vars.example 为 .dev.vars 进行配置


